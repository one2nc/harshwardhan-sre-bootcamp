apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: student-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: init-db
        image: harsh18262one2n/student-api:50c8f8e9
        command: ['sh', '-c', "flask db migrate;flask db upgrade"]
        envFrom:
          - secretRef:
              name: db-creds
      containers:
      - image: harsh18262one2n/student-api:50c8f8e9
        name: student-api
        resources: {}
        envFrom:
          - secretRef:
              name: db-creds
      nodeSelector: 
        type: application
status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: student-api
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
