
{{- range $appName, $app := .Values.apps }}
{{- if $app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{$appName}}
    {{- include "student-api-chart.labels" $ | nindent 4 }}
  name: {{$appName}}
  namespace: {{.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{$appName}}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{$appName}}
    spec:
      {{- with .initContainers}}
      initContainers:
        {{- range $init:= .}}
        - name: {{$init.name}}
          image: {{ $init.image | default "$app.image"}}:{{ $init.tag | default $app.tag}}
          {{- with $app.command}}
          command: {{ toJson . }}
          {{- end}}
          {{- with .envSecretName}}
          envFrom:
          - secretRef:
              name: {{. }}
          {{- end}}
      {{- end}}
      {{- end}}
      containers:
      - image: {{.image}}:{{.tag}}
        name: {{$appName}}
        resources: {}
        {{- with .envSecretName}}
        envFrom:
          - secretRef:
              name: {{ . }}
          {{- end}}
      {{- with .nodeSelector}}
      nodeSelector: 
      {{toYaml . | indent 8}} 
      {{- end}}
---
{{- end}}
{{- end}}