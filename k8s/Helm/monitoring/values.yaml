loki-stack:
  enabled: true
  grafana:
    enabled: false
  prometheus:
    enabled: false
  loki:
    nodeSelector:
      type: dependent_services
  promtail:
    config:
      clients:
        - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
      snippets:
        extraScrapeConfigs: |
          - job_name: kubernetes-pods-api
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: api
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - action: replace
                source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
                target_label: __path__
                separator: /
                replacement: /var/log/pods/*$1/*.log
        scrapeConfigs: ""
  

kube-prometheus-stack:
  enabled: true
  
  kube-state-metrics:
    nodeSelector:
      type: dependent_services
  
  prometheus:
    prometheusSpec:
      additionalScrapeConfigs:
        - job_name: 'postgres_exporter'
          static_configs:
            - targets: ['observability-prometheus-postgres-exporter.student-api.svc.cluster.local']
        - job_name: 'blackbox-https'
          scrape_timeout: 15s
          scrape_interval: 15s
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
          - targets:
              - http://api-service.student-api.svc.cluster.local:5000/healthcheck
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: observability-prometheus-blackbox-exporter:9115
      nodeSelector:
        type: dependent_services

  alertmanager:
    alertmanagerSpec:
      nodeSelector:
        type: dependent_services

  prometheusOperator:
    nodeSelector:
      type: dependent_services


  grafana:
      enabled: true 
      nodeSelector:
        type: dependent_services 
      additionalDataSources: 
        - name: Loki
          type: loki
          access: proxy
          url:  http://{{ .Release.Name }}-loki:3100/
          version: 1
prometheus-postgres-exporter:
  enabled: true
  config:
    datasource:
      host: "db-service.student-api.svc.cluster.local"
      userSecret:
        name: "db-creds"
        key: "POSTGRES_USER" 
      passwordSecret:
        name: "db-creds"
        key: "POSTGRES_PASSWORD" 
      database: "mydb"
  namespaceOverride: student-api
  nodeSelector:
    type: dependent_services
prometheus-blackbox-exporter:
  enabled: true
  nodeSelector:
    type: dependent_services