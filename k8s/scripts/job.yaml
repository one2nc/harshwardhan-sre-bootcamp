apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: write-secret-and-read-cm
  namespace: vault-ns
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - configmap
  verbs:
  - read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-sa-rb
  namespace: vault-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: write-secret-and-read-cm
subjects:
- kind: ServiceAccount
  name: job-sa
  namespace: vault-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-sa
  namespace: vault-ns
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-vault
  namespace: vault-ns
spec:
  template:
    metadata: {}
    spec:
      volumes:
      - name: script-volume
        configMap:
          name: setup-script
      containers:
      - image: hashicorp/vault
        name: bootstrap-vault
        resources: {}
        command: ['sh','/script/vault_setup.sh']
        volumeMounts:
        - name: script-volume
          mountPath: /script
      restartPolicy: Never
      serviceAccountName: job-sa
status: {}
