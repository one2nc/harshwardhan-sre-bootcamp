name: Build and Deploy Application

on:
  push:
    branches: [ main, exercise-9]
    paths:
      - '*'
      
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write


env:
  DOCKER_REPOSITORY: student-api
  DB_URL: ${{ secrets.DB_URL }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'main'

    - name: Run Tests
      run: docker run -d --rm -p "5432:5432" -e POSTGRES_DB=${{ secrets.DB_NAME }} -e POSTGRES_USER=${{ secrets.DB_USER }} -e POSTGRES_PASSWORD=${{ secrets.DB_PASS }} postgres:17

    - name: Run Tests
      run: make test

  linting:
    name: Code Linting
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'main'

    - name: Install Ruff
      id: install-ruff
      run: |
          python -m pip install ruff

    - name: Run Ruff
      run: make lint

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: linting
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'main'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build, tag, and push image to Docker Hub
      id: build-image
      run: |
          make docker-build DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          make docker-push DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
  update-helm:
    name: Update Helm values
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'helm'

    - name: Update Image tag
      id: build-image
      run: |
          apt update;apt install yq
          make update-helm
          git add .
          git commit -m "Update new tag"
          git push