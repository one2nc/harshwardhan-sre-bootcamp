name: Build and Deploy Application

on:
  push:
    branches: [ exercise-4 ]
    paths:
      - '*'
      
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_REPOSITORY: student-api
  SQLITE_DB: ${{ secrets.SQLITE_DB }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'exercise-4'


    - name: Run Tests
      run: make test

  linting:
    name: Code Linting
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'exercise-4'

    - name: Install Ruff
      id: install-ruff
      run: |
          python -m pip install ruff

    - name: Run Ruff
      run: make lint

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: linting
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: 'exercise-4'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build, tag, and push image to Docker Hub
      id: build-image
      run: |
          make docker-build DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          make docker-push DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
